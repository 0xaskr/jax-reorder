[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "jax-reorder"
version = "0.1.0"
description = "Canonicalize and compare JAX computation graphs."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jax[cpu]",
    "numpy>=2.5.3",
]

[project.urls]
Repository = "https://github.com/0xaskr/jax-reorder"
Issues = "https://github.com/0xaskr/jax-reorder/issues"

[dependency-groups]
dev = [
    "flax>=0.12.10",
    "pytest>=8",
    "ruff>=0.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/jax_reorder"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "business: 原始业务层、AI hardcode 候选及独立数值参照",
    "stress: 受控规模的深度、长链和高扇出压力",
]
